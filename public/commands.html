<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commands - Xrypton</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <svg class="nav-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span>Xrypton</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/commands" class="nav-link active">Commands</a>
                <a href="/bot" class="nav-link">Bot Stats</a>
                <a href="/status" class="nav-link">Status</a>
            </div>
        </div>
    </nav>
    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">Commands</h1>
            <p class="page-subtitle">Browse all available commands organized by module</p>
        </div>

        <div class="module-pills" id="module-pills">
            <span class="module-pill all active" data-module="all">All Commands</span>
        </div>

        <div class="command-grid" id="command-grid">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>

        <div class="empty-state" id="empty-state" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <polyline points="4 7 4 4 20 4 20 7"/>
                <line x1="9" y1="20" x2="15" y2="20"/>
                <line x1="12" y1="4" x2="12" y2="20"/>
            </svg>
            <p>No commands found</p>
        </div>
    </main>
    <footer class="footer">
        <p>Xrypton Discord Bot &copy; 2024</p>
    </footer>
    <script src="/static/js/main.js"></script>
    <script>
    let allCommands = [];
    let currentModule = 'all';

    async function loadCommands() {
        const grid = document.getElementById('command-grid');
        const emptyState = document.getElementById('empty-state');
        const pillsContainer = document.getElementById('module-pills');
        
        grid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
        emptyState.style.display = 'none';
        
        try {
            const response = await fetch('/api/commands');
            const data = await response.json();
            
            if (data.commands && data.commands.length > 0) {
                allCommands = data.commands;
                renderModulePills(pillsContainer);
                renderCommands(grid);
            } else {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
            }
            
            if (data.updated_at) {
                console.log('Commands last updated:', new Date(data.updated_at).toLocaleString());
            }
        } catch (e) {
            console.error('Failed to load commands:', e);
            grid.innerHTML = '';
            emptyState.style.display = 'block';
            emptyState.querySelector('p').textContent = 'Failed to load commands';
        }
    }

    function renderModulePills(container) {
        const modules = [...new Set(allCommands.map(cmd => cmd.module).filter(Boolean))].sort();
        const allPill = container.querySelector('.module-pill.all');
        container.innerHTML = '';
        container.appendChild(allPill);
        
        modules.forEach(module => {
            const pill = document.createElement('span');
            pill.className = 'module-pill';
            pill.dataset.module = module.toLowerCase();
            pill.textContent = module;
            pill.addEventListener('click', () => selectModule(module.toLowerCase(), pill));
            container.appendChild(pill);
        });
    }

    function selectModule(module, pill) {
        document.querySelectorAll('.module-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentModule = module;
        renderCommands(document.getElementById('command-grid'));
    }

    function renderCommands(grid) {
        const filtered = currentModule === 'all' 
            ? allCommands 
            : allCommands.filter(cmd => cmd.module?.toLowerCase() === currentModule);
        
        if (filtered.length === 0) {
            grid.innerHTML = '';
            document.getElementById('empty-state').style.display = 'block';
            return;
        }
        
        document.getElementById('empty-state').style.display = 'none';
        
        grid.innerHTML = filtered.map(cmd => `
            <div class="command-card">
                <div class="command-header">
                    <span class="command-name">${escapeHtml(cmd.name)}</span>
                    ${cmd.module ? `<span class="command-module">${escapeHtml(cmd.module)}</span>` : ''}
                </div>
                <p class="command-description">${escapeHtml(cmd.description || 'No description')}</p>
                <div class="command-args">
                    ${renderArgs(cmd.arguments)}
                </div>
            </div>
        `).join('');
    }

    function renderArgs(args) {
        if (!args || args.length === 0) {
            return '<span style="color: var(--text-muted); font-size: 0.75rem;">No arguments</span>';
        }
        return args.map(arg => `
            <span class="arg-tag ${arg.required ? 'required' : 'optional'}">
                ${escapeHtml(arg.name)}${arg.required ? '*' : ''}
            </span>
        `).join('');
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    loadCommands();
    setInterval(loadCommands, 60000);
    </script>
</body>
</html>
